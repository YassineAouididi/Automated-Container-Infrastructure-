---
- name: Create web content directory
  ansible.builtin.file:
    path: "{{ web_content_path }}"
    state: directory
    mode: "0755"

- name: Deploy web page
  ansible.builtin.copy:
    dest: "{{ web_content_path }}/index.html"
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>Automated Container Infrastructure</title></head>
      <body>
        <h1>It works!</h1>
        <p>Deployed by Ansible on {{ inventory_hostname }}</p>
      </body>
      </html>
    mode: "0644"

- name: Run Apache container
  community.docker.docker_container:
    name: "{{ web_container_name }}"
    image: "{{ web_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ web_host_port }}:{{ web_container_port }}"
    volumes:
      - "{{ web_content_path }}:{{ web_container_path }}:ro"
