---
- name: Install and configure Docker on Linux servers
  hosts: linux_servers
  become: true
  gather_facts: true

  vars:
    docker_users:
      - "{{ ansible_user }}"
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    # ---------- Debian / Ubuntu ----------
    - name: Install repo prerequisites (Debian family)
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Add Docker apt repository (Debian family)
      ansible.builtin.deb822_repository:
        name: docker.io
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Docker (Debian family)
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    # ---------- RHEL / Rocky ----------
    - name: Add Docker yum repository (RedHat family)
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/rhel/gpg
        enabled: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install Docker (RedHat family)
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    # ---------- Common ----------
    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: item != 'root'

    - name: Verify Docker daemon is working
      ansible.builtin.command: docker info --format '{{ "{{.ServerVersion}}" }}'
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "Docker server version: {{ docker_version.stdout }}"
